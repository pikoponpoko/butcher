[package]
name = "line_melt"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
after-effects = "0.4"

[build-dependencies]
pipl = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
