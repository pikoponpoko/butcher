<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSD書き出し検証</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="seg" id="tool"><button data-v="img" aria-pressed="true">画像</button><button data-v="gif">GIF・動画</button></div>
    <div class="tabs img-only" id="tabs" role="tablist"></div>
    <div class="bar-r">
      <select id="sample" class="img-only" aria-label="サンプル"></select>
      <label class="btn img-only" for="file">開く</label>
      <label class="btn gif-only" for="gFile">開く</label>
      <input id="gFile" type="file" accept="video/*,.mp4,.webm,.mov,.m4v" hidden>
      <input id="file" type="file" accept=".psd,.psb,.clip,.png,.jpg,.jpeg,.webp,.gif,.bmp" multiple hidden>
    </div>
  </header>
  <aside class="panel layers" aria-label="レイヤー">
    <div class="ph"><div class="seg" id="pane"><button data-v="layer" aria-pressed="true">レイヤー</button><button data-v="slice">スライス</button></div>
      <span class="lp"><button class="link" id="selAll">すべて</button><button class="link" id="selNone">解除</button></span>
      <span class="sp" hidden><button class="link" id="slLoad">読込</button><button class="link" id="slSave">保存</button><input id="slFile" type="file" accept=".json,application/json" hidden></span></div>
    <div class="tree lp" id="tree"></div>
    <div class="slist sp" id="slist" hidden></div>
    <div class="sprops sp" id="sprops" hidden>
      <div class="r"><input id="sName" type="text" aria-label="スライス名"><div class="seg"><button id="sRound" aria-pressed="false" title="丸く切り抜いたときの見え方">丸</button></div><button class="link" id="sDel">削除</button></div>
      <div class="g"><span>X</span><input id="sX" class="n" type="number"><span>Y</span><input id="sY" class="n" type="number">
        <span>W</span><input id="sW" class="n" type="number" min="1"><span>H</span><input id="sH" class="n" type="number" min="1"></div>
    </div>
  </aside>
  <main class="center">
    <div class="stage" id="stage"><div class="cv"><canvas id="pv" width="1" height="1"></canvas><div class="sl" id="sl"></div></div><div class="warnbox" id="pvInfo" hidden></div><div class="drop" id="drop" hidden>ここにドロップ</div></div>
    <div class="status"><span id="pvName"></span><span id="pvSize" class="num" style="margin-left:auto"></span><span id="pvState"></span><button class="link" id="saveOne">保存</button></div>
  </main>
  <aside class="panel inspector" aria-label="書き出し設定">
    <div class="insp">
      <div class="sec">
        <div class="prop lp"><span>方式</span><div class="seg" id="mode"><button data-v="layer">レイヤー</button><button data-v="folder" aria-pressed="true">フォルダ</button><button data-v="both">両方</button></div></div>
        <div class="prop"><span>形式</span><div class="seg" id="fmt"><button data-v="png" aria-pressed="true">PNG</button><button data-v="jpeg">JPEG</button><button data-v="webp">WebP</button></div></div>
        <label class="prop" for="quality" id="qualityRow" hidden><span>画質</span><span class="unit"><input id="quality" class="n" type="number" min="1" max="100" value="90"></span></label>
      </div>
      <div class="sec">
        <div class="prop"><span>サイズ</span><div class="seg" id="size"><button data-v="orig" aria-pressed="true">原寸</button><button data-v="w">幅</button><button data-v="h">高さ</button></div></div>
        <div class="prop" id="sizeRow" hidden><span></span><span class="unit" style="grid-column: 2 / -1"><input id="px" class="n" type="number" min="1" max="20000" value="1080" aria-label="ピクセル">px
          <select id="basis" aria-label="基準" style="margin-left: 4px"><option value="canvas">キャンバス</option><option value="image">画像ごと</option></select></span></div>
        <label class="prop sw lp" for="trim"><span>余白カット</span><input id="trim" type="checkbox" checked></label>
      </div>
      <div class="sec">
        <label class="prop" for="prefix"><span>接頭辞</span><input id="prefix" class="t" type="text"></label>
        <label class="prop" for="suffix"><span>接尾辞</span><input id="suffix" class="t" type="text"></label>
      </div>
      <div class="sec">
        <label class="sw" for="hidden">非表示レイヤーを含む<input id="hidden" type="checkbox"></label>
        <label class="sw lp" for="tree2">フォルダ階層を保持<input id="tree2" type="checkbox" checked></label>
        <label class="sw sp" for="slFill" hidden>透明部分を周囲の色で補完<input id="slFill" type="checkbox" checked></label>
        <label class="sw" for="allFiles">開いているファイルをすべて処理<input id="allFiles" type="checkbox"></label>
      </div>
    </div>
    <div class="foot">
      <div class="sumrow"><span id="sum" class="num"></span><span id="status" class="muted"></span></div>
      <label class="sw" for="incWarn" id="incWarnRow" hidden>警告のある画像も書き出す<input id="incWarn" type="checkbox"></label>
      <div class="act"><div class="seg" id="out"><button data-v="zip" aria-pressed="true">ZIP</button><button data-v="each">個別</button><button data-v="dir" id="outDir" hidden>フォルダ</button></div><button class="btn primary" id="export">書き出し</button></div>
    </div>
  </aside>
  <section class="gif" id="gif">
    <main class="center" style="display:flex">
      <div class="stage" id="gStage"><canvas id="gPv" width="1" height="1" hidden></canvas><img id="gResI" alt="" hidden><video id="gResV" muted loop playsinline hidden></video><span class="gempty" id="gEmpty">動画をドロップ</span></div>
      <div class="tl"><button class="play" id="gPlay" aria-label="再生"></button><div class="track" id="gTrack"><canvas id="gThumbs"></canvas><div class="dim" id="gDimL"></div><div class="dim" id="gDimR"></div><div class="rng" id="gRng"></div><div class="ph2" id="gHead"></div></div><span class="num" id="gTime"></span></div>
      <div class="status"><span id="gName"></span><span id="gOut" class="num" style="margin-left:auto"></span><div class="seg" id="gView" hidden><button data-v="src" aria-pressed="true">元</button><button data-v="res">結果</button></div><button class="link" id="gSave" hidden>保存</button></div>
    </main>
    <aside class="panel inspector" aria-label="GIF書き出し設定">
      <div class="insp">
        <div class="sec">
          <label class="prop" for="gTpl"><span>テンプレート</span><select id="gTpl"></select></label>
          <div class="prop"><span>形式</span><div class="seg" id="gFmt"><button data-v="gif" aria-pressed="true">GIF</button><button data-v="webp">WebP</button><button data-v="mp4">MP4</button></div></div>
        </div>
        <div class="sec">
          <div class="prop"><span>幅</span><span class="unit"><input id="gW" class="n" type="number" min="16" max="4096">px</span></div>
          <div class="prop"><span>高さ</span><span class="unit"><input id="gH" class="n" type="number" min="16" max="4096">px <button class="lock" id="gLock" aria-pressed="true" title="縦横比を固定"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M5 7 7 5M4.2 5.4 3 6.6a2 2 0 0 0 2.8 2.8L7 8.2M7.8 6.6 9 5.4A2 2 0 0 0 6.2 2.6L5 3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button></span></div>
          <div class="prop" id="gFitRow"><span>合わせ方</span><div class="seg" id="gFit"><button data-v="cover" aria-pressed="true">切り抜き</button><button data-v="contain">余白</button></div></div>
          <div class="prop" id="gBgRow" hidden><span>背景</span><div class="seg" id="gBg"><button data-v="transparent" id="gBgT">透明</button><button data-v="#000000" aria-pressed="true">黒</button><button data-v="#ffffff">白</button></div></div>
        </div>
        <div class="sec">
          <div class="prop"><span>範囲</span><span class="unit"><input id="gStart" class="n" type="number" min="0" step="0.01" aria-label="開始">–<input id="gEnd" class="n" type="number" min="0" step="0.01" aria-label="終了">秒</span></div>
          <div class="prop"><span>FPS</span><span class="unit"><input id="gFps" class="n" type="number" min="1" max="60"></span></div>
          <label class="prop" for="gSpeed"><span>速度</span><select id="gSpeed"><option>0.25</option><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option><option>3</option><option>4</option></select></label>
          <label class="prop" for="gLoop" id="gLoopRow"><span>ループ</span><select id="gLoop"><option value="0">無限</option><option value="1">1回</option><option value="2">2回</option><option value="3">3回</option></select></label>
        </div>
        <div class="sec">
          <div class="prop"><span>目標サイズ</span><span class="unit"><input id="gTarget" class="n" type="number" min="0" step="0.1" placeholder="なし">MB</span></div>
          <label class="prop" for="gColors" id="gColorsRow"><span>色数</span><select id="gColors"><option>256</option><option>128</option><option>64</option><option>32</option><option>16</option></select></label>
          <label class="prop" for="gQ" id="gQRow" hidden><span>画質</span><span class="unit"><input id="gQ" class="n" type="number" min="1" max="100" value="80"></span></label>
          <div class="prop"><span>設定</span><span class="unit"><button class="link" id="gPLoad">読込</button><button class="link" id="gPSave">保存</button><input id="gPFile" type="file" accept=".json,application/json" hidden></span></div>
        </div>
      </div>
      <div class="foot">
        <div class="sumrow"><span id="gSum" class="num"></span><span id="gStatus" class="muted"></span></div>
        <div class="act"><button class="link" id="gKeep" hidden>このまま保存</button><button class="btn primary" id="gExport" style="margin-left:auto">書き出し</button></div>
      </div>
    </aside>
  </section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
